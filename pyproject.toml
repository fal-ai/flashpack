[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "flashpack"
dynamic = ["version"]
description = "Load ML models fast"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "fal-ai-community"}
]
dependencies = [
    "accelerate>=1.0",
    "click>=6.0",
    "safetensors>=0.4",
    "torch>=2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
flashpack = "flashpack.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pre-commit>=3.0.0",
    "setuptools-scm>=9.2.0",
]
fpz = [
    "zstandard>=0.22",
]
# GPU Zstd decode for the fpz read path (opt-in via FLASHPACK_FPZ_GPU_DECODE=1).
# NOTE: nvidia-libnvcomp-cu12 is NVIDIA-proprietary redistributable software,
# not OSI-licensed -- a license review is required before this extra ships.
# Kept out of the default and `fpz` deps so a plain install stays MIT-only.
fpz-gpu = [
    "zstandard>=0.22",
    "nvidia-libnvcomp-cu12",
]

[tool.setuptools_scm]
write_to = "src/flashpack/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device (skipped automatically when unavailable)",
    "network: downloads model weights from the Hugging Face Hub",
]
